<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MishpuchaTech</title>
  <meta name="theme-color" content="#F7F1E6" />
  <style>
    :root {
      --paper: #f7f1e6;
      --ink: #1f1a14;
      --muted: #6b6256;
      --rule: #cfc3ad;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
    }
    main {
      box-sizing: border-box;
      max-width: 36rem;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
      border-bottom: 1px solid var(--rule);
    }
    p.kicker {
      margin: 0 0 0.75rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }
    h1 {
      margin: 0 0 1rem;
      font-weight: 600;
      line-height: 1.2;
    }
    p {
      margin: 0 0 1rem;
      line-height: 1.5;
      color: var(--ink);
    }
    p.muted { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <p class="kicker">MishpuchaTech</p>
    <h1>Ваша семья. Ваше сообщество. Ваше цифровое пространство.</h1>
    <p>Семейная книга для горских евреев: открытые вход и регистрация, одно древо, которое видят только свои.</p>
    <p class="muted">Семейное древо открывается в приложении после входа.</p>
  </main>
</body>
</html>
